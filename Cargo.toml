[package]
name = "rigorstarter-webpage-leptos"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
gloo-net = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-compiler = { path = "./scripts" }
wasm-bindgen = "0.2"
js-sys = "0.3.98"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
