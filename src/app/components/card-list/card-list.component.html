<div class="card-list-container">
  <div class="search-wrapper">
    <input
      type="text"
      class="search-input"
      placeholder="Search components..."
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearchChange($event)"
    />
    <span class="search-icon">🔍</span>
    @if (searchQuery()) {
      <button type="button" class="clear-btn" (click)="clearSearch()">×</button>
    }
  </div>

  <div class="category-tabs">
    @for (tab of categories; track tab.id) {
      <button
        type="button"
        class="category-tab"
        [class.active]="selectedCategory() === tab.id"
        (click)="selectCategory(tab.id)"
      >
        <span class="tab-icon">{{ tab.icon }}</span>
        <span class="tab-label">{{ tab.label }}</span>
      </button>
    }
  </div>

  <div class="cards-grid">
    @for (card of filteredCards(); track card.title) {
      <app-card [card]="card" (cardClick)="onCardClick($event)" />
    } @empty {
      <div class="no-results">
        <p>No components found</p>
        @if (searchQuery()) {
          <p class="no-results-hint">Try adjusting your search or filter</p>
        }
      </div>
    }
  </div>
</div>
